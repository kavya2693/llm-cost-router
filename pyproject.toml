[project]
name = "llm-cost-router"
version = "0.1.0"
description = "Send each LLM request to the cheapest local model likely to get it right, and escalate when a cheap check fails"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# The runtime needs nothing beyond the standard library: Ollama is reached over plain HTTP.
dependencies = []

[project.scripts]
llm-cost-router = "llm_cost_router.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_router"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
