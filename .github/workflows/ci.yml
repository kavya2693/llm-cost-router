name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: types
        run: uv run mypy

      # Every model call in the tests is stubbed, so no model server or key is needed.
      - name: tests
        run: uv run pytest -q

      # Regenerates the suite and replays the committed response cache; the README tables
      # must come out unchanged.
      - name: reproduce results from cache
        run: |
          uv run python scripts/generate_data.py
          git diff --exit-code data/
          uv run llm-cost-router evaluate
          git diff --exit-code outputs/results.md outputs/results.json
