      - "16.4M LLM requests a year. 4 tasks, 3 self-hosted models. Which ones can a 3B model take?"
      - "200 cases, known answers · 3B $0.06 · 7B $0.20 per M tokens · wrong small answers ship silently"
    assumptions: [A-01, A-02, A-07]
    illustrative: ["Rings in the background are decoration."]
    change: "Headline spans #hook-l1..l3 and chips #hook-f1..f3 in compositions/s02-hook.html."
  - id: "03"
    title: "How it works (white chapter, slide A)"
    image: slides/slide-03.jpg
    time: "11.3-19.3 s"
    composition: "compositions/explainer.html (CONFIG.blocks, CONFIG.groups)"
    text:
      - "03 · HOW IT WORKS"
      - "Cheap first, checked, then big"
      - "REQUEST email, ticket, report, sum → PICK MODEL a small model per task → [CHEAP TRY: SMALL MODEL a 3B model tries first → CHECK well formed? sure of it?] → [FALLBACK: BIG MODEL only if the check fails] → ANSWER ✓ lower bill ✓ mostly small ✓ answers checked"
    assumptions: [A-02, A-04]
    illustrative: ["Icons and colours are a visual language, not data."]
    change: "Edit CONFIG in compositions/explainer.html; badge truth is F-09."
  - id: "04"
    title: "The key idea (white chapter, slide B)"
    image: slides/slide-04.jpg
    time: "19.3-26.3 s"
    composition: "compositions/explainer.html (#ex-b)"
    text:
      - "04 · THE KEY IDEA"
      - "Checking without an answer key"
      - "Is the answer well formed? — right keys, one known label, short summary"
      - "Did it come from the request? — every value must appear in the email"
      - "Was the model sure of it? — a confidence bar, tuned on practice cases"
      - "ONE REAL ORDER EMAIL · CASE EXT-023: 'Please raise a new order PO-51719 for Summit Auto Parts. We need LED panel light 60x60 (SKU LED-3580). I first wrote 12 units, but please make it 20 units instead. Delivery to our Sharjah site by May 14, 2026.' → order PO-51719 ✓ customer Summit Auto Parts ✓ sku LED-3580 ✓ quantity 20 ✓ city Sharjah ✓ date 2026-05-14 ✓ · All six found in the email: keep the 3B answer."
      - "Worked for orders, tickets and summaries. On arithmetic, 6 confident wrong answers got through."
    assumptions: [A-04, A-05]
    illustrative: ["The email is an excerpt of case ext-023 (greeting, previous-order line, phone number and sign-off omitted); the six ticks show verify_extraction's grounding rule, which checks every value."]
    change: "Markup under #ex-b in compositions/explainer.html; the footnote figures are F-12 and F-13."
  - id: "05"
    title: "Architecture"
    image: slides/slide-05.jpg
    time: "26.0-41.0 s"
    composition: "compositions/s03-architecture.html"
    text:
      - "05 · ARCHITECTURE"
      - "A verifier-gated cascade, tuned offline."
      - "OFFLINE · TUNED ON THE DEV SPLIT: data.py Generator (seeded, answers first) → eval_suite.jsonl Eval suite (200 cases · 4 tasks, dev 80 · test 120) → dev 80 → evaluate.py calibrate() (per task, the cheapest ≥ 7B) ← answers ← outputs/responses/ Response cache (3 models × 200, ≈ 46 min CPU) · data/ Traffic log (365 days, 16.4M / yr)"
      - "ONLINE · PER REQUEST · ≤ 2 CALLS: prompts.py Request (task + input, 1 prompt/task) → prompt → router.py Router.route() [extract llama3.2 τ 0 · classify qwen 3B τ 0 · summary llama3.2 τ 0 · reason qwen 3B τ .9999 · ≤ 2 calls / request] → 3B first → Ollama Small 3B (qwen2.5-coder:3b, llama3.2, $0.06 / M tok) → text + logprobs → verifiers.py verify() (schema, grounded in input, confidence ≥ τ) → pass → Answer (to the caller · 3B kept 91% · p50 3.6 s · p95 20.4 s · on CPU)"
      - "fail → 7B or conf < τ → Ollama Large 7B (qwen2.5-coder:7b, $0.20 / M tok) → 7B answer → Answer · no small model → Large 7B · policy × 4 (calibrate → Router) · calls logged (Small 3B → Response cache)"
      - "EVALUATION · REPLAYS THE CACHE · make run < 1 s: evaluate.py Replay arms (6 arms · 120) → grading.py Answer key (the router never sees it) → right? → summarise() Score (completion · cost) → paired_bootstrap() Bootstrap (95% CI · 4,000) → outputs/ results.json, per_case.csv"
      - "critical path · 1 small call · 91% of requests · p50 3.6 s vs 5.8 s for all-7B"
      - "Legend: data · models · router · verifier · evaluation · per request (solid) · batch / offline (dashed)"
    assumptions: [A-01, A-02, A-03, A-04, A-06, A-08, A-09]
    illustrative: ["Packets moving along the wires are a schematic of execution order; 1 escalation in 11 packets approximates the 11 / 120 escalation share, not real traffic.", "'Ollama' marks the model calls made by client.py; the evaluation replays the same calls from the cache.", "The 'no small model' path exists in router.py (TaskPolicy first=None) but the tuned policy does not use it for any task.", "The critical-path p50 (3.6 s) is the router's median over all held-out requests, including escalated ones."]
    change: "Node boxes (#n-*) and the edge table E in compositions/s03-architecture.html."
