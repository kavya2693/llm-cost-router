# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re

  def TEST():
      return J('outputs/results.json')['splits']['test']

  def _block(path, name):
      m = _re.search(r"const " + name + r" = (\{.*?\}); /\* " + name + ":END", T(path), _re.S)
      return json.loads(m.group(1))

  def _router_cases():
      d = R('outputs/per_case.csv')
      return d[d['arm'] == 'router, tuned on dev'].reset_index(drop=True)

  def _log():
      return {r['id']: r for r in J('demo:assets/routing_log.json')['rows']}

  def split_sizes():
      L = [json.loads(x) for x in T('data/eval_suite.jsonl').strip().splitlines()]
      return 'dev {} · test {}'.format(sum(c['split'] == 'dev' for c in L), sum(c['split'] == 'test' for c in L))

  def grid_matches():
      """GRID cells in s04-routes.html == per_case.csv (tuned router) row by row; the log agrees too."""
      g = _block('demo:compositions/s04-routes.html', 'GRID')
      pc = _router_cases()
      if len(g['cells']) != len(pc):
          return False
      for cell, (_, r) in zip(g['cells'], pc.iterrows()):
          if cell != [r['task'], int(bool(r['escalated'])), int(bool(r['correct']))]:
              return False
      log = _log()
      for _, r in pc.iterrows():
          x = log[r['id']]
          if (x['escalated'], x['correct'], x['final_model']) != (bool(r['escalated']), bool(r['correct']), r['final_model']):
              return False
          if abs(x['cost_usd'] - r['cost_usd']) > 1e-9:
              return False
      return (g['kept'], g['escalated'], g['correct'], g['cases']) == (109, 11, 99, 120)

  def arms_match():
      g = _block('demo:compositions/s04-routes.html', 'GRID')
      t = TEST()
      names = {'all qwen 3B': 'all-small qwen2.5-coder:3b', 'all llama3.2': 'all-small llama3.2', 'all 7B': 'all-large qwen2.5-coder:7b',
               'router, checks only': 'router, structural check only', 'router, tuned': 'router, tuned on dev', 'perfect verifier': 'oracle (perfect verifier)'}
      return len(g['arms']) == 6 and all(
          a['completion'] == round(100 * t[names[a['name']]]['completion'], 1) and a['cost'] == round(t[names[a['name']]]['cost_per_1k_usd'], 4)
          for a in g['arms'])

  def ledger_matches():
      """SHEET rows in value.html == routing log == per_case.csv for the six cases shown."""
      s = _block('demo:compositions/value.html', 'SHEET')
      log = _log()
      pc = _router_cases().set_index('id')
      if [r['id'] for r in s['rows']] != ['ext-023', 'cla-021', 'sum-026', 'rea-040', 'rea-021', 'cla-035']:
          return False
      for r in s['rows']:
          x, p = log[r['id']], pc.loc[r['id']]
          if r['by'] != ('7B' if bool(p['escalated']) else '3B'):
              return False
          if r['cost_1k'] != '${:.3f}'.format(1000 * p['cost_usd']):
              return False
          if r['check'].startswith('✓') != (x['check_passed'] and x['confidence'] >= x['threshold']):
              return False
          if r['task'] == 'reasoning' and ('ANSWER: ' + r['answer'].split()[-1]) not in x['output']:
              return False
          if r['task'] == 'classification' and r['answer'] != x['output'].strip().split()[0]:
              return False
          if r['task'] == 'summarization' and r['answer'].split()[0] not in x['output']:
              return False
          if r['task'] == 'extraction' and not all(v in x['output'] for v in r['answer'].replace(' units', '').split(' · ')):
              return False
      return (s['kept'], s['escalated'], s['cost_per_1k'], s['cases']) == (109, 11, 0.0176, 120)

  def ext023_ok():
      x = _log()['ext-023']
      o = json.loads(x['output'][x['output'].find('{'):x['output'].rfind('}') + 1])
      want = {'order_id': 'PO-51719', 'customer': 'Summit Auto Parts', 'sku': 'LED-3580', 'quantity': 20, 'delivery_city': 'Sharjah', 'delivery_date': '2026-05-14'}
      return o == want and x['check_passed'] and not x['escalated'] and x['first_model'] == 'llama3.2' and 'May 14, 2026' in x['input']

  def confident_wrong_ok():
      rows = [r for r in _log().values() if r['task'] == 'reasoning' and not r['escalated'] and not r['correct']]
      return len(rows) == 6 and all(r['confidence'] > 0.9999 for r in rows)

  def rea028_ok():
      x = _log()['rea-028']
      return ('38 * 168 = 6264' in x['output'] and 'ANSWER: 6309' in x['output'] and x['answer'] == 6429
              and 38 * 168 == 6384 and 6384 + 45 == 6429 and not x['escalated'] and x['confidence'] > 0.9999
              and grep('outputs/responses/qwen2.5-coder_3b.jsonl', r'38 \* 168 = 6264'))

  def components_exist():
      src = 'src/llm_cost_router/'
      defs = {'router.py': [r'def route\('], 'evaluate.py': [r'def calibrate\(', r'def summarise\(', r'def paired_bootstrap\(', r'def run_arm\('],
              'verifiers.py': [r'def verify\('], 'client.py': [r'class ResponseCache', r'def ollama_call\('], 'prompts.py': [r'def build_prompt\('],
              'grading.py': [r'def grade\('], 'data.py': [r'def generate_suite\(', r'def generate_traffic\(']}
      ok = all(grep(src + f, rx) for f, rxs in defs.items() for rx in rxs)
      files = ['data/eval_suite.jsonl', 'data/traffic_daily.csv', 'outputs/results.json', 'outputs/per_case.csv', 'outputs/responses/llama3.2.jsonl']
      return ok and all(len(T(f)) > 0 for f in files)
