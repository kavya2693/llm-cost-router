# Audit facts for the llm-cost-router demo video.
# Read by docs/demo/source/tools/build_audit_report.py (paths below are relative to this file).
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).
# TEST() = J('outputs/results.json')['splits']['test'] and the other helpers are defined at the bottom.

project:
  name: llm-cost-router
  title: "llm-cost-router: demo video audit report"
  repo_url: https://github.com/kavya2693/llm-cost-router
  repo_dir: ../../../..
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 84.0
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [llm_cost_router]
  regenerate:
    - "make run                                   # data/*, outputs/results.json|md, per_case.csv (replays the response cache, under a second)"
    - ".venv/bin/python docs/demo/source/tools/export_routing_log.py docs/demo/source/assets/routing_log.json"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/routing_log.json outputs/results.json docs/demo/source/compositions --rows ext-023,cla-021,sum-026,rea-040,rea-021,cla-035"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/llm-cost-router-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/llm-cost-router-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {suite_and_traffic: 20261013, ollama_seed: 7, temperature: 0, bootstrap_seed: 0}
  run_time: "make run replays the committed response cache in 0.47 s (outputs/run_log.txt); refreshing the cache with make models took 45.8 min of CPU inference (13.3 + 11.8 + 20.7 min)"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem: 200 evaluation cases (50 per task type, half easy, half hard) and 365 days of request volume per task type. The production data is proprietary."
    source: "src/llm_cost_router/config.py:15 (SEED = 20261013); src/llm_cost_router/data.py:390-470; README 'The data'"
    all_figures: true
    edit: ["src/llm_cost_router/data.py", "src/llm_cost_router/config.py:15"]
    rerun: ["make data", "make models (~46 min CPU) if prompts or cases change", "make run"]
  - id: A-02
    statement: "Prices are an assumption, not a quote: $0.06 per million tokens for the 3B models and $0.20 for the 7B model. The saving is driven by the 3.3x ratio between tiers."
    source: "src/llm_cost_router/config.py:34-37 (MODELS); README 'Known limitations'"
    figures: [F-07, F-09, F-31, F-32, F-37, F-38, F-40, F-43]
    edit: ["src/llm_cost_router/config.py:34-37"]
    rerun: ["make run", "export_routing_log.py + inject_sheet.py"]
  - id: A-03
    statement: "Latency is the measured CPU inference time per request on an M1 Pro laptop shared with other jobs (model load time excluded); an escalated request waits for the small call and then the large one."
    source: "src/llm_cost_router/client.py:79; src/llm_cost_router/router.py:43-46; README lines 53-54 and 'Known limitations'"
    figures: [F-16, F-22, F-23]
    edit: ["re-collect with make models on the target machine"]
    rerun: ["make models", "make run"]
  - id: A-04
    statement: "The routing policy is tuned on the dev split only (20 cases per task type): per task, the cheapest {first small model, confidence threshold} whose dev completion is at least the 7B model's. Every headline number is on the 120 held-out cases."
    source: "src/llm_cost_router/evaluate.py:102-134 (calibrate); src/llm_cost_router/data.py:402 (split)"
    figures: [F-12, F-13, F-14, F-19, F-21, F-27, F-28, F-29, F-30, F-31, F-33, F-35, F-36, F-37, F-38, F-39, F-40, F-42, F-44]
    edit: ["src/llm_cost_router/evaluate.py:102-134", "DEV_PER_TYPE in src/llm_cost_router/data.py"]
    rerun: ["make run", "export_routing_log.py + inject_sheet.py"]
  - id: A-05
    statement: "Ground truth comes from the generator (answers fixed before the text is written); grading.py is the answer key the router never sees. A summary must stay under 40 words and use only numbers from the report."
    source: "src/llm_cost_router/grading.py:1-13; src/llm_cost_router/verifiers.py:99-112"
    figures: [F-08, F-12, F-13, F-33, F-34, F-35, F-37, F-39, F-42, F-44, F-45]
    edit: ["src/llm_cost_router/grading.py"]
    rerun: ["make run"]
  - id: A-06
    statement: "Models run at temperature 0 with seed 7, but multi-threaded CPU inference is not bit-for-bit deterministic; the committed response cache (outputs/responses/*.jsonl) is what makes every number reproducible."
    source: "src/llm_cost_router/client.py:50; README 'Known limitations'"
    all_figures: true
    edit: ["outputs/responses/*.jsonl (via make models)"]
    rerun: ["make models", "make run"]
  - id: A-07
    statement: "Annual volume is the sum of the 365-day traffic log, with logging gaps filled by the mean of the same weekday within 28 days; the projected bill multiplies each task's cost per 1k requests by its volume."
    source: "src/llm_cost_router/evaluate.py:146-166 (annual_volume, projected_annual_cost); data.py:428 (base_daily = 38,000)"
    figures: [F-03, F-17, F-43]
    edit: ["src/llm_cost_router/data.py:428-446"]
    rerun: ["make data", "make run"]
  - id: A-08
    statement: "The completion interval is a paired bootstrap over the same 120 cases, 4,000 resamples, seed 0."
    source: "src/llm_cost_router/evaluate.py:136-142"
    figures: [F-26, F-42]
    edit: ["src/llm_cost_router/evaluate.py:136"]
    rerun: ["make run"]
  - id: A-09
    statement: "Output caps per task (160, 8, 90, 220 tokens) keep a full collection run under an hour on CPU; a truncated reasoning answer fails its check."
    source: "src/llm_cost_router/config.py:44 (MAX_TOKENS); verifiers.py:134-137"
    figures: [F-16]
    edit: ["src/llm_cost_router/config.py:44"]
    rerun: ["make models", "make run"]
  - id: A-10
    statement: "Video rounding: percentages to whole numbers or 1 decimal, dollars per 1k to 4 decimals, per-request costs as $ per 1k to 3 decimals, the yearly bill to whole dollars, 16.4M to 1 decimal, 45.8 min shown as '≈ 46 min'."
    source: "this audit (display convention)"
    figures: [F-03, F-16, F-21, F-22, F-23, F-31, F-32, F-33, F-34, F-37, F-38, F-39, F-40, F-43, F-44]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-11
    statement: "Slide 01 (industry, everyday problems) is general knowledge about running LLMs in operations, used as context. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem' and 'Why it is hard' support all four problems"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Who relates: operations & logistics platforms, customer support desks, in-house AI platform teams", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (everything to the biggest model; most traffic routine; a small model fails silently; a wrong answer costs people time)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem', 'Why it is hard'", key: "README lines 12-35", formula: "-",
     check: {expr: "grep('README.md', r'send all of it to the biggest model') and grep('README.md', r'most of those requests are routine') and grep('README.md', r'there is no answer key') and grep('README.md', r\"costs a person's time\")", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "05", "08"], label: "Annual request volume from the traffic log", shown: "16.4M LLM requests a year / 16.4M / yr / 16.4M req", type: derived, source: "outputs/results.json", key: "annual_requests (sum over 4 tasks = 16,394,979)", formula: "sum / 1e6, 1 decimal",
     check: {expr: "sum(J('outputs/results.json')['annual_requests'].values()) / 1e6", fmt: "{:.1f}M", expect: "16.4M"}}
  - {id: F-04, slides: ["02", "05"], label: "Task types", shown: "4 tasks", type: direct, source: "outputs/results.json", key: "policy (one entry per task type)", formula: "count",
     check: {expr: "len(J('outputs/results.json')['policy'])", fmt: "{:d}", expect: "4"}}
  - {id: F-05, slides: ["02", "05", "10"], label: "Self-hosted models", shown: "3 self-hosted models / 3 models", type: direct, source: "outputs/results.json", key: "model_seconds (one entry per model)", formula: "count",
     check: {expr: "len(J('outputs/results.json')['model_seconds'])", fmt: "{:d}", expect: "3"}}
  - {id: F-06, slides: ["02", "05", "10"], label: "Evaluation cases with known answers", shown: "200 cases, known answers", type: direct, source: "data/eval_suite.jsonl", key: "line count; every case has an 'answer'", formula: "count",
     check: {expr: "(lambda L: len(L) if all('\"answer\"' in x for x in L) else -1)(T('data/eval_suite.jsonl').strip().splitlines())", fmt: "{:d}", expect: "200"}}
  - {id: F-07, slides: ["02", "05", "08"], label: "Price per million tokens: 3B $0.06, 7B $0.20", shown: "3B $0.06 · 7B $0.20 per M tokens", type: direct, source: "src/llm_cost_router/config.py:35-37", key: "MODELS usd_per_m_*", formula: "-",
     check: {expr: "grep('src/llm_cost_router/config.py', r'\"llama3.2\", \"small\", 3.2, 0.06, 0.06') and grep('src/llm_cost_router/config.py', r'\"qwen2.5-coder:3b\", \"small\", 3.1, 0.06, 0.06') and grep('src/llm_cost_router/config.py', r'\"qwen2.5-coder:7b\", \"large\", 7.6, 0.20, 0.20')", fmt: bool}}
  - {id: F-08, slides: ["02"], label: "Wrong small answers ship silently (a cascade with only structural checks lets wrong answers through)", shown: "wrong small answers ship silently", type: derived, source: "outputs/results.json", key: "splits.test['router, structural check only'].wrong_accepted_small = 27", formula: "> 0",
     check: {expr: "TEST()['router, structural check only']['wrong_accepted_small'] > 0", fmt: bool}}
  # ---- slide 03
  - {id: F-09, slides: ["03"], label: "Badges: lower bill, mostly small, answers checked (tuned router vs all-7B, held out)", shown: "lower bill / mostly small / answers checked", type: derived, source: "outputs/results.json; src/llm_cost_router/router.py:61", key: "cost_per_1k_usd router < all-large; share_answered_small > 0.5; verify() runs on every small answer", formula: "-",
     check: {expr: "TEST()['router, tuned on dev']['cost_per_1k_usd'] < TEST()['all-large qwen2.5-coder:7b']['cost_per_1k_usd'] and TEST()['router, tuned on dev']['share_answered_small'] > 0.5 and grep('src/llm_cost_router/router.py', r'verdict = verify\\(case, first\\)')", fmt: bool}}
  - {id: F-10, slides: ["03", "05"], label: "At most two calls per request: one small, one large (no retry loop)", shown: "≤ 2 calls / request; FALLBACK", type: direct, source: "src/llm_cost_router/router.py:54-66; README 'Stop condition'", key: "route(): one optional small call, one large call", formula: "-",
     check: {expr: "T('src/llm_cost_router/router.py').count('calls.append(') == 2 and grep('README.md', r'at most two calls per request')", fmt: bool}}
  # ---- slide 04
  - {id: F-11, slides: ["04", "07"], label: "Case ext-023: the 3B model's six extracted values, all found in the email; answer kept", shown: "PO-51719 · Summit Auto Parts · LED-3580 · 20 · Sharjah · 2026-05-14; keep the 3B answer", type: direct, source: "demo:assets/routing_log.json (export of the repo's Router)", key: "id = ext-023: first_model, check_passed, escalated, output, input", formula: "-",
     check: {expr: "ext023_ok()", fmt: bool}}
  - {id: F-12, slides: ["04", "09"], label: "Held-out arithmetic answers that were wrong but passed the confidence bar", shown: "6 confident wrong answers got through / 6 wrong answers passed above 0.9999", type: derived, source: "outputs/per_case.csv; demo:assets/routing_log.json", key: "arm = router, tuned on dev; task = reasoning; escalated = False; correct = False", formula: "count = 6; every confidence > 0.9999",
     check: {expr: "len(R('outputs/per_case.csv').query(\"arm == 'router, tuned on dev' and task == 'reasoning' and escalated == False and correct == False\")) if confident_wrong_ok() else -1", fmt: "{:d}", expect: "6"}}
  - {id: F-13, slides: ["04", "09"], label: "Worked for orders, tickets and summaries: router completion ≥ all-7B on extraction, classification, summarization", shown: "Worked for orders, tickets and summaries", type: derived, source: "outputs/results.json", key: "splits.test[arm].by_task[task].completion", formula: "router ≥ all-large for 3 tasks",
     check: {expr: "all(TEST()['router, tuned on dev']['by_task'][k]['completion'] >= TEST()['all-large qwen2.5-coder:7b']['by_task'][k]['completion'] for k in ('extraction', 'classification', 'summarization'))", fmt: bool}}
  # ---- slide 05
  - {id: F-14, slides: ["05"], label: "Split sizes", shown: "dev 80 · test 120", type: direct, source: "data/eval_suite.jsonl", key: "split", formula: "count per split",
     check: {expr: "split_sizes()", fmt: "{}", expect: "dev 80 · test 120"}}
  - {id: F-15, slides: ["05", "10"], label: "Response cache: every model on every case", shown: "3 models × 200", type: direct, source: "outputs/responses/*.jsonl", key: "line counts", formula: "200 lines in each of 3 files",
     check: {expr: "[len(T('outputs/responses/' + f).strip().splitlines()) for f in ('llama3.2.jsonl', 'qwen2.5-coder_3b.jsonl', 'qwen2.5-coder_7b.jsonl')] == [200, 200, 200]", fmt: bool}}
  - {id: F-16, slides: ["05"], label: "CPU inference time to fill the cache", shown: "≈ 46 min CPU", type: derived, source: "outputs/results.json", key: "model_seconds (796.1 + 706.2 + 1240.3 s)", formula: "sum / 60 = 45.8 min, rounded",
     check: {expr: "round(sum(J('outputs/results.json')['model_seconds'].values()) / 60)", fmt: "{:d}", expect: "46"}}
  - {id: F-17, slides: ["05"], label: "Traffic log length", shown: "365 days", type: direct, source: "data/traffic_daily.csv", key: "row count", formula: "-",
     check: {expr: "len(R('data/traffic_daily.csv'))", fmt: "{:d}", expect: "365"}}
  - {id: F-18, slides: ["05"], label: "Every architecture box names a real file or function", shown: "data.py, eval_suite.jsonl, evaluate.py calibrate(), outputs/responses/, data/, prompts.py, router.py Router.route(), Ollama (client.py), verifiers.py verify(), grading.py, summarise(), paired_bootstrap(), outputs/results.json, per_case.csv", type: direct, source: "src/llm_cost_router/*.py; data/; outputs/", key: "file / def", formula: "-",
     check: {expr: "components_exist()", fmt: bool}}
  - {id: F-19, slides: ["05"], label: "Tuned policy: extraction llama3.2 τ 0, classification qwen 3B τ 0, summarization llama3.2 τ 0, reasoning qwen 3B τ 0.9999", shown: "policy table in Router.route()", type: direct, source: "outputs/results.json", key: "policy[task].first, policy[task].threshold", formula: "-",
     check: {expr: "{k: (v['first'], v['threshold']) for k, v in J('outputs/results.json')['policy'].items()} == {'extraction': ('llama3.2', 0.0), 'classification': ('qwen2.5-coder:3b', 0.0), 'summarization': ('llama3.2', 0.0), 'reasoning': ('qwen2.5-coder:3b', 0.9999)}", fmt: bool}}
  - {id: F-20, slides: ["05"], label: "Verifier checks: schema, grounded in input, confidence ≥ τ", shown: "schema / grounded in input / confidence ≥ τ", type: direct, source: "src/llm_cost_router/verifiers.py:59-149; router.py:62", key: "verify_* functions; verdict.confidence >= policy.threshold", formula: "-",
     check: {expr: "grep('src/llm_cost_router/verifiers.py', r'not found in the email') and grep('src/llm_cost_router/verifiers.py', r'wrong keys') and grep('src/llm_cost_router/router.py', r'verdict.confidence >= policy.threshold')", fmt: bool}}
  - {id: F-21, slides: ["05", "06", "08"], label: "Share of held-out requests answered by a 3B model (tuned router)", shown: "3B kept 91% / 91% of requests / 91%", type: direct, source: "outputs/results.json", key: "splits.test['router, tuned on dev'].share_answered_small = 0.9083", formula: "x 100, whole number",
     check: {expr: "100 * TEST()['router, tuned on dev']['share_answered_small']", fmt: "{:.0f}%", expect: "91%"}}
  - {id: F-22, slides: ["05"], label: "Router latency p50 / p95 (held out, CPU)", shown: "p50 3.6 s · p95 20.4 s", type: direct, source: "outputs/results.json", key: "splits.test['router, tuned on dev'].p50_latency_s, p95_latency_s", formula: "1 decimal",
     check: {expr: "'p50 {:.1f} s · p95 {:.1f} s'.format(TEST()['router, tuned on dev']['p50_latency_s'], TEST()['router, tuned on dev']['p95_latency_s'])", fmt: "{}", expect: "p50 3.6 s · p95 20.4 s"}}
  - {id: F-23, slides: ["05"], label: "All-7B latency p50", shown: "vs 5.8 s for all-7B", type: direct, source: "outputs/results.json", key: "splits.test['all-large qwen2.5-coder:7b'].p50_latency_s", formula: "1 decimal",
     check: {expr: "TEST()['all-large qwen2.5-coder:7b']['p50_latency_s']", fmt: "{:.1f} s", expect: "5.8 s"}}
  - {id: F-24, slides: ["05"], label: "Evaluation replays 6 arms", shown: "6 arms · 120", type: direct, source: "outputs/results.json", key: "splits.test arms with a completion", formula: "count",
     check: {expr: "sum(1 for v in TEST().values() if isinstance(v, dict) and 'completion' in v)", fmt: "{:d}", expect: "6"}}
  - {id: F-25, slides: ["05", "10"], label: "make run replays the cache in under a second", shown: "make run < 1 s / replays … in under a second", type: direct, source: "outputs/run_log.txt:85", key: "'make run ... 0.469 total'", formula: "total < 1 s",
     check: {expr: "float(re.search(r'make run .* ([0-9.]+) total', T('outputs/run_log.txt')).group(1)) < 1", fmt: bool}}
  - {id: F-26, slides: ["05"], label: "Bootstrap resamples", shown: "95% CI · 4,000", type: direct, source: "src/llm_cost_router/evaluate.py:136", key: "reps: int = 4000", formula: "-",
     check: {expr: "grep('src/llm_cost_router/evaluate.py', r'reps: int = 4000')", fmt: bool}}
  - {id: F-27, slides: ["05"], label: "Calibration rule: cheapest policy with dev completion at least the 7B's", shown: "per task, the cheapest ≥ 7B", type: direct, source: "src/llm_cost_router/evaluate.py:105-122", key: "options below large completion are skipped; key = (cost, -completion, threshold)", formula: "-",
     check: {expr: "'if s[\"completion\"] + 1e-9 < large[\"completion\"]:' in T('src/llm_cost_router/evaluate.py')", fmt: bool}}
  # ---- slide 06
  - {id: F-28, slides: ["06", "07"], label: "Held-out requests", shown: "120 held-out requests", type: direct, source: "outputs/results.json", key: "splits.test['router, tuned on dev'].n", formula: "-",
     check: {expr: "TEST()['router, tuned on dev']['n']", fmt: "{:d}", expect: "120"}}
  - {id: F-29, slides: ["06", "07", "08"], label: "Requests answered by a 3B model (tuned router, held out)", shown: "109 / 109 answered by 3B / 109 of 120 requests", type: direct, source: "outputs/per_case.csv", key: "arm = router, tuned on dev; escalated = False", formula: "count",
     check: {expr: "int((R('outputs/per_case.csv').query(\"arm == 'router, tuned on dev'\")['escalated'] == False).sum())", fmt: "{:d}", expect: "109"}}
  - {id: F-30, slides: ["06", "07"], label: "Requests escalated to the 7B (tuned router, held out)", shown: "11 / 11 escalated", type: direct, source: "outputs/per_case.csv", key: "arm = router, tuned on dev; escalated = True", formula: "count",
     check: {expr: "int(R('outputs/per_case.csv').query(\"arm == 'router, tuned on dev'\")['escalated'].sum())", fmt: "{:d}", expect: "11"}}
  - {id: F-31, slides: ["06", "07", "08"], label: "Router cost per 1k requests (held out)", shown: "$0.0176", type: direct, source: "outputs/results.json", key: "splits.test['router, tuned on dev'].cost_per_1k_usd = 0.0175998", formula: "4 decimals",
     check: {expr: "TEST()['router, tuned on dev']['cost_per_1k_usd']", fmt: "${:.4f}", expect: "$0.0176"}}
  - {id: F-32, slides: ["06", "07", "08"], label: "All-7B cost per 1k requests (held out)", shown: "$0.0452", type: direct, source: "outputs/results.json", key: "splits.test['all-large qwen2.5-coder:7b'].cost_per_1k_usd = 0.045235", formula: "4 decimals",
     check: {expr: "TEST()['all-large qwen2.5-coder:7b']['cost_per_1k_usd']", fmt: "${:.4f}", expect: "$0.0452"}}
  - {id: F-33, slides: ["06", "08"], label: "Router completion (held out)", shown: "82.5%", type: direct, source: "outputs/results.json", key: "splits.test['router, tuned on dev'].completion = 0.825", formula: "x 100, 1 decimal",
