  - {id: F-34, slides: ["06", "08"], label: "All-7B completion (held out)", shown: "85.0%", type: direct, source: "outputs/results.json", key: "splits.test['all-large qwen2.5-coder:7b'].completion = 0.85", formula: "x 100, 1 decimal",
     check: {expr: "100 * TEST()['all-large qwen2.5-coder:7b']['completion']", fmt: "{:.1f}%", expect: "85.0%"}}
  - {id: F-35, slides: ["06"], label: "Grid: one cell per held-out request (kept / escalated / wrong), in case order", shown: "120-cell grid", type: direct, source: "outputs/per_case.csv; demo:compositions/s04-routes.html (GRID block)", key: "arm = router, tuned on dev: task, escalated, correct", formula: "cell-by-cell equality",
     check: {expr: "grid_matches()", fmt: bool}}
  - {id: F-36, slides: ["06"], label: "Every escalation came from the confidence bar (the structural check passed)", shown: "failed the confidence bar", type: derived, source: "demo:assets/routing_log.json (export of the repo's Router)", key: "escalated rows: check_passed, confidence < threshold", formula: "-",
     check: {expr: "all(r['check_passed'] and r['confidence'] < r['threshold'] for r in J('demo:assets/routing_log.json')['rows'] if r['escalated'])", fmt: bool}}
